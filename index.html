<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Domination — Goldberg G(24,0) World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: 'Segoe UI', sans-serif; }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    #globe-panel {
      width: 50%;
      height: 100%;
      position: relative;
      border-right: 2px solid #333;
    }

    #local-panel {
      width: 50%;
      height: 100%;
      position: relative;
    }

    /* Curtain shared styles */
    .curtain {
      position: absolute;
      top: 0;
      width: 280px;
      height: 100%;
      background: rgba(10, 10, 10, 0.5);
      overflow-y: auto;
      z-index: 20;
      padding: 12px;
      font-size: 12px;
      color: #ddd;
      pointer-events: auto;
    }

    /* Detail panel — bottom of local map */
    #detail-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 280px; /* stop before the combat curtain */
      height: calc(20 * 1.4em + 16px);
      background: rgba(10, 10, 10, 0.85);
      border-top: 1px solid rgba(80, 80, 80, 0.5);
      padding: 6px 10px;
      font-size: 12px;
      color: #ddd;
      z-index: 20;
      overflow-y: auto;
      pointer-events: auto;
    }

    #detail-panel .section {
      display: inline-block;
      vertical-align: top;
      margin-right: 16px;
    }

    #detail-panel h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(100, 100, 100, 0.5);
      padding-bottom: 4px;
    }

    #detail-panel .unit-card {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid rgba(100, 100, 100, 0.4);
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 6px;
    }

    #detail-panel .unit-card .unit-label {
      font-weight: bold;
      color: #fff;
      margin-bottom: 2px;
    }

    #detail-panel .unit-card .unit-attr {
      color: #ccc;
      font-size: 11px;
    }

    #detail-panel .unit-card .unit-attr-detail {
      margin-top: 4px;
      font-size: 11px;
    }

    #detail-panel .unit-card .unit-attr-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid rgba(80, 80, 80, 0.3);
    }

    #detail-panel .unit-card .unit-attr-row:last-child {
      border-bottom: none;
    }

    #detail-panel .unit-card .unit-attr-key {
      color: #aaa;
    }

    #detail-panel .unit-card .unit-attr-val {
      color: #fff;
      font-weight: bold;
    }

    #detail-panel .empty-msg {
      color: #999;
      font-style: italic;
    }

    /* Left curtain (strategy panel) */
    #strategy-panel {
      left: 0;
      border-right: 1px solid rgba(80, 80, 80, 0.5);
    }

    .curtain h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #fff;
      border-bottom: 1px solid rgba(100, 100, 100, 0.5);
      padding-bottom: 4px;
    }

    .curtain .section {
      margin-bottom: 12px;
    }

    .curtain .unit-card {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid rgba(100, 100, 100, 0.4);
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 6px;
    }

    .curtain .unit-card .unit-label {
      font-weight: bold;
      color: #fff;
      margin-bottom: 2px;
    }

    .curtain .unit-card .unit-attr {
      color: #ccc;
      font-size: 11px;
    }

    .curtain .unit-card .unit-attr-detail {
      margin-top: 4px;
      font-size: 11px;
    }

    .curtain .unit-card .unit-attr-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid rgba(80, 80, 80, 0.3);
    }

    .curtain .unit-card .unit-attr-row:last-child {
      border-bottom: none;
    }

    .curtain .unit-card .unit-attr-key {
      color: #aaa;
    }

    .curtain .unit-card .unit-attr-val {
      color: #fff;
      font-weight: bold;
    }

    .curtain .empty-msg {
      color: #999;
      font-style: italic;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
    }

    #info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 11px;
      color: #888;
      pointer-events: none;
      z-index: 10;
    }

    /* Menu bar at top of right curtain */
    #curtain-menu-bar {
      display: flex;
      gap: 6px;
      padding: 6px 0 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.4);
      flex-wrap: wrap;
    }

    #curtain-menu-bar button {
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid #555;
      color: #eee;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #curtain-menu-bar button:hover {
      background: rgba(70, 70, 70, 0.9);
    }

    /* Combat log panel — right curtain */
    #combat-log-panel {
      right: 0;
      border-left: 1px solid rgba(80, 80, 80, 0.5);
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
    }

    #combat-log-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 11px;
    }

    #combat-log-panel .cl-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(80, 80, 80, 0.3);
      padding-bottom: 4px;
    }

    #combat-log-panel .cl-nav {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    #combat-log-panel .cl-nav button {
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid #555;
      color: #eee;
      font-size: 13px;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #combat-log-panel .cl-nav button:hover {
      background: rgba(70, 70, 70, 0.9);
    }
    #combat-log-panel .cl-nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #combat-log-panel .cl-counter {
      color: #555;
      font-size: 10px;
      flex-shrink: 0;
    }

    #combat-log-panel .cl-header {
      font-weight: bold;
      font-size: 12px;
    }

    #combat-log-panel .cl-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #combat-log-panel .cl-empty {
      color: #666;
      font-style: italic;
      padding-top: 4px;
    }

    #combat-log-panel .cl-step {
      padding: 2px 0;
      border-bottom: 1px solid rgba(50, 50, 50, 0.4);
    }
    #combat-log-panel .cl-step:last-child {
      border-bottom: none;
    }
    #combat-log-panel .cl-step-title {
      color: #aaa;
      font-weight: bold;
    }
    #combat-log-panel .cl-step-desc {
      color: #999;
      margin-left: 8px;
    }
    #combat-log-panel .cl-step-formula {
      color: #777;
      margin-left: 8px;
      font-family: monospace;
      font-size: 10px;
    }
    #combat-log-panel .cl-step-result {
      margin-left: 8px;
      font-weight: bold;
    }

    #combat-log-panel .cl-splash-header {
      color: #fa0;
      font-weight: bold;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(100, 100, 100, 0.3);
    }

    #combat-log-panel .cl-vs-unit {
      padding: 4px 0;
    }
    #combat-log-panel .cl-vs-name {
      font-weight: bold;
      font-size: 12px;
    }
    #combat-log-panel .cl-vs-stats {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 2px;
    }
    #combat-log-panel .cl-vs-stats span {
      margin-right: 6px;
    }
    #combat-log-panel .cl-vs-divider {
      color: #888;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      padding: 2px 0;
    }

    #combat-log-panel .cl-preview {
      color: #fa0;
      font-style: italic;
      padding-top: 4px;
    }

    /* AI Playback bar — pinned above turn controls in the flex column */
    #ai-playback-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-top: 1px solid rgba(100, 100, 100, 0.4);
      background: rgba(10, 10, 10, 0.7);
    }

    #ai-playback-bar .ai-pb-label {
      font-size: 12px;
      font-weight: bold;
      color: #fa0;
    }

    #ai-playback-bar .ai-pb-buttons {
      display: flex;
      gap: 6px;
    }

    #ai-playback-bar .ai-pb-btn {
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid #555;
      color: #eee;
      font-size: 14px;
      width: 30px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #ai-playback-bar .ai-pb-btn:hover:not(:disabled) {
      background: rgba(70, 70, 70, 0.9);
      border-color: #888;
    }
    #ai-playback-bar .ai-pb-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    #ai-playback-bar .ai-pb-btn.ai-pb-active {
      background: rgba(80, 60, 0, 0.7);
      border-color: #fa0;
      color: #fa0;
    }
    #ai-playback-bar .ai-pb-counter {
      font-size: 11px;
      color: #999;
      min-width: 36px;
      text-align: right;
    }

    #turn-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 8px 0;
      margin-top: auto;
      border-top: 1px solid rgba(80, 80, 80, 0.4);
    }
    #next-turn-btn {
      background: rgba(40, 40, 40, 0.9);
      border: 1px solid #555;
      color: #eee;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #next-turn-btn:hover {
      background: rgba(70, 70, 70, 0.95);
      border-color: #888;
    }

    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 1000;
      gap: 20px;
    }

    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(100, 100, 100, 0.3);
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #loading .loading-text {
      font-size: 16px;
      color: #888;
      letter-spacing: 0.5px;
    }

    #loading .loading-status {
      font-size: 12px;
      color: #555;
      min-height: 1.4em;
      transition: opacity 0.2s;
    }

    #loading.error .spinner {
      animation: none;
      border-color: #a33;
      border-top-color: #a33;
    }

    #loading.error .loading-text {
      color: #c55;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Drone Domination</div>
    <div class="loading-status">Initialising…</div>
  </div>
  <div id="app">
    <div id="globe-panel">

      <canvas id="globe-canvas"></canvas>
      <div id="strategy-panel" class="curtain">
        <div class="section"><h3>Strategy</h3><div class="empty-msg">Strategic info will appear here</div></div>
      </div>
    </div>
    <div id="local-panel">

      <canvas id="local-canvas"></canvas>
      <div id="detail-panel">
        <div id="detail-content"></div>
      </div>
      <div id="combat-log-panel" class="curtain">
        <div id="curtain-menu-bar">
          <button id="new-world-btn" title="Generate a new world (N)">+ New</button>
          <button id="home-btn" title="Centre on home city (Home)">⌂ Home</button>
          <button id="save-btn" title="Save game (Ctrl+S)">💾 Save</button>
          <button id="load-btn" title="Load game (Ctrl+L)">📂 Load</button>
          <button id="test-units-btn" title="Open 3D unit model test grid" onclick="window.open('/test-units.html','_blank')">🤖 Unit Models</button>
        </div>
        <div id="combat-log-content"></div>
        <div id="turn-controls">
          <button id="next-turn-btn" title="End turn (Space)">Next ▶</button>
        </div>
      </div>
    </div>
  </div>
  <div id="info">Click a tile on either view to inspect. Scroll to zoom. Drag to rotate/pan.</div>
  <script type="module" src="/client/main.ts"></script>
</body>
</html>
