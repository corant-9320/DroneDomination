<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Domination — Goldberg G(100,0) World</title>
  <link rel="stylesheet" href="/client/styles.css" />
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Drone Domination</div>
    <div class="loading-status">Initialising…</div>
  </div>
  <div id="app">
    <div id="globe-panel">

      <canvas id="globe-canvas"></canvas>
      <div id="strategy-panel" class="curtain collapsed">
        <button class="curtain-toggle" title="Toggle panel (T)">›</button>
        <div class="section"><h3>Strategy</h3><div class="empty-msg">Strategic info will appear here</div></div>
      </div>
    </div>
    <div id="split-handle" title="Drag to resize panels"><span id="split-label">40%</span></div>
    <div id="local-panel">

      <canvas id="local-canvas"></canvas>
      <div id="combat-log-panel" class="curtain">
        <div class="curtain-margin">
          <button class="curtain-toggle" title="Toggle panel">‹</button>
          <button class="rp-tab active" id="rp-tab-main" title="Selection Info" data-tab="main"><span>Selection Info</span></button>
          <button class="rp-tab" id="rp-tab-history" title="Combat History" data-tab="history"><span>History</span></button>
        </div>
        <div id="combat-log-inner">
          <!-- Tab: Main panel -->
          <div id="rp-tab-content-main">
            <div id="system-menu-wrapper">
              <button id="system-menu-btn" title="System menu">☰ Menu ▾</button>
              <div id="system-menu-dropdown">
                <button id="new-world-btn" title="Generate a new world (N)">+ New</button>
                <button id="save-btn" title="Save game (Ctrl+S)">💾 Save</button>
                <button id="load-btn" title="Load game (Ctrl+L)">📂 Load</button>
                <div class="menu-divider"></div>
                <button id="test-units-btn" title="Open 3D unit model test grid" onclick="window.open('/test-units.html','_blank')">🤖 Unit Designer</button>
              </div>
            </div>
            <div class="rp-section" id="unit-info-section">
              <div class="rp-section-header">Unit Info <span id="hex-info-desc" class="hex-info-desc"></span></div>
              <div class="rp-section-body" id="unit-info-body"><span class="empty-msg">No unit selected</span></div>
            </div>
            <div class="rp-section" id="enemy-info-section">
              <div class="rp-section-header">Enemy Info <span id="enemy-info-desc" class="hex-info-desc"></span></div>
              <div class="rp-section-body" id="enemy-info-body"><span class="empty-msg">No enemy in range</span></div>
              <div class="rp-section-body" id="enemy-hex-body"></div>
            </div>
            <div class="rp-section" id="combat-info-section">
              <div class="rp-section-header">Combat Preview</div>
              <div class="rp-section-body" id="combat-info-body"><span class="empty-msg">Hover an enemy to preview</span></div>
            </div>
          </div>
          <!-- Tab: Combat History -->
          <div id="rp-tab-content-history" style="display:none;">
            <div id="combat-log-content"></div>
          </div>
          <div id="turn-controls">
            <button id="next-turn-btn" title="End turn (Space)">Next ▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="info">Click a tile on either view to inspect. Scroll to zoom. Drag to rotate/pan.</div>
  <script type="module" src="/client/main.ts"></script>
</body>
</html>
